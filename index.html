<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web OS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="desktop" class="desktop-shell">
      <div class="background-glow glow-1"></div>
      <div class="background-glow glow-2"></div>

      <header class="topbar glass">
        <div class="status-left">
          <div class="signal-dot"></div>
          <span>Web OS</span>
        </div>
        <div class="topbar-center">
          <span id="clock"></span>
        </div>
        <div class="status-right">
          <span>Offline Mode</span>
        </div>
      </header>

      <main class="desktop-area">
        <aside id="desktopIcons" class="desktop-icons"></aside>
        <div id="windowLayer" class="window-layer"></div>
      </main>

      <nav class="dock glass">
        <div id="dockApps" class="dock-apps"></div>
        <button id="startButton" class="start-button">Start</button>
      </nav>

      <div id="startMenu" class="start-menu glass hidden">
        <div class="start-header">Applications</div>
        <div class="start-search-wrap">
          <input id="startSearch" type="text" placeholder="Search apps..." />
        </div>
        <div id="startList" class="start-list"></div>
      </div>

      <div id="desktopContextMenu" class="context-menu hidden"></div>
      <div id="notificationCenter" class="notification-center"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
